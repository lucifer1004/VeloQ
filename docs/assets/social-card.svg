<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="2%" r="62%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.20" />
      <stop offset="55%" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b0e14" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect x="20.5" y="20.5" width="1159" height="589" rx="18" fill="none" stroke="#1f2733" stroke-width="1" />

  <!-- v+Q mark (full: lens-Q + velocity chevron + speed streaks) -->
  <g transform="translate(553,150) scale(1.72)">
    <line x1="2" y1="19" x2="11" y2="19" stroke="#16786c" stroke-width="4" stroke-linecap="round" />
    <line x1="0.5" y1="29" x2="9" y2="29" stroke="#16786c" stroke-width="4" stroke-linecap="round" />
    <circle cx="30" cy="26" r="15" fill="none" stroke="#1f9e8f" stroke-width="5.5" />
    <line x1="40.6" y1="36.6" x2="54" y2="51" stroke="#1f9e8f" stroke-width="6.5" stroke-linecap="round" />
    <path d="M22 22 L30 32 L38 22" fill="none" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- wordmark -->
  <text x="600" y="362" text-anchor="middle"
        font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace"
        font-size="104" font-weight="700" letter-spacing="-1" fill="#e6edf3">VeloQ</text>

  <!-- accent bar -->
  <rect x="528" y="384" width="144" height="6" rx="3" fill="#2dd4bf" />

  <!-- tagline -->
  <text x="600" y="450" text-anchor="middle"
        font-family="'JetBrains Mono','DejaVu Sans Mono',monospace"
        font-size="30" fill="#2dd4bf">Pure CLI in / JSON contract out</text>

  <!-- descriptor -->
  <text x="600" y="496" text-anchor="middle"
        font-family="-apple-system,'Segoe UI',Roboto,'DejaVu Sans',sans-serif"
        font-size="22" fill="#8b98a9">Agent-friendly profile-query CLI · Nsight Systems + Nsight Compute</text>

  <!-- footer -->
  <text x="600" y="586" text-anchor="middle"
        font-family="'JetBrains Mono','DejaVu Sans Mono',monospace"
        font-size="19" fill="#586172">github.com/lucifer1004/veloq</text>
</svg>
