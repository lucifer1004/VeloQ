name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_VERSION: "1.89.0"
  GOVCTL_VERSION: "0.9.4"
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Governance check + fmt + clippy + the full workspace test suite.
  # Glibc image: rust's musl host triple blocks proc-macro compilation.
  # Use trixie because govctl's Linux GNU release requires glibc 2.39;
  # release binaries stay musl-static via the release workflow's cross
  # build.
  test:
    name: gov + fmt + clippy + test
    runs-on: ubuntu-latest
    container:
      image: rust:1.89.0-slim-trixie
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config ca-certificates cmake
      - name: Install govctl
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: govctl-org/govctl
          tag: v${{ env.GOVCTL_VERSION }}
          # v3 filters extracted files by asset-name too; the archive's
          # executable is named plain `govctl`.
          asset-name: govctl
          binaries-location: govctl-v${{ env.GOVCTL_VERSION }}-x86_64-unknown-linux-gnu
          digest: de84c36ed6651d1044111bfdacbb112eb1d0ddd23baf4981bfaab823da8e5940
          cache: enable
      - run: govctl --version
      - run: govctl check
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
        # --profile ci = release opt-level without LTO (fast compile). The
        # shipped binary's LTO/strip config is validated by the cross job
        # (below) and release.yml.
      - run: cargo clippy --workspace --all-targets --profile ci -- -D warnings
      - run: cargo test --workspace --profile ci

  # Smoke that a freshly built binary actually runs and emits the
  # envelope contract. Debug build is enough for the CLI surface.
  e2e:
    name: e2e smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install build deps + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake jq
      - name: Build veloq
        run: cargo build -p veloq
      - name: Smoke
        run: |
          BIN=target/debug/veloq
          "$BIN" --version
          "$BIN" sources | jq -e '.data.count > 0'
          "$BIN" sources | jq -e '.data.rows[].key' >/dev/null
          "$BIN" schema stats | jq -e '.data.target == "stats"'
          "$BIN" ncu schema launches | jq -e '.data.target == "launches"'

  # Verify every release target still cross-compiles. This also lets main
  # populate the shared per-target caches that PRs and release tags restore.
  # Build-only — the release workflow builds, packages, and uploads these
  # same targets on a `v*` tag. Same zigbuild path as release.yml so a green
  # run here means a green release build.
  cross:
    name: cross-build ${{ matrix.target }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rust-cross/cargo-zigbuild@sha256:dce4ea213244423439d97a2070031c6ea287fc32f01b0aaa38f8b4d46f52e68c
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain + target
        run: |
          apt-get update && apt-get install -y --no-install-recommends cmake
          rustup set profile minimal
          rustup toolchain install "${RUST_VERSION}" --profile minimal --no-self-update
          rustup target add --toolchain "${RUST_VERSION}" "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
      - name: Cross-build
        run: cargo +${RUST_VERSION} zigbuild --release -p veloq --target ${{ matrix.target }}
