[package]
name = "veloq"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent-friendly VeloQ profile-query CLI for NSys, NCU, and PyTorch/Kineto profiles."
repository.workspace = true
homepage.workspace = true
keywords = ["nsight", "cuda", "gpu", "profiling", "cli"]
categories = ["command-line-utilities", "development-tools::profiling"]
# Publish whitelist — ship only the binary sources. Cargo always adds
# Cargo.toml plus a minimized Cargo.lock; tests stay out of the package.
include = ["src/**/*.rs"]

[[bin]]
name = "veloq"
path = "src/main.rs"

[dependencies]
agent-plugin-installer.workspace = true
bincode.workspace = true
veloq-core.workspace = true
veloq-ncu.workspace = true
veloq-nsys.workspace = true
veloq-pytorch.workspace = true
clap.workspace = true
env_logger.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
self_update.workspace = true
semver.workspace = true
mimalloc.workspace = true
thiserror.workspace = true
interprocess.workspace = true
sysinfo.workspace = true
libc.workspace = true
terminal_size.workspace = true

[dev-dependencies]
anyhow.workspace = true
duckdb.workspace = true
tempfile.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.'cfg(all(target_os = "linux", target_arch = "x86_64"))']
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-x86_64-unknown-linux-musl.tar.gz"
bin-dir = "{ name }-v{ version }-x86_64-unknown-linux-musl/{ bin }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.'cfg(all(target_os = "linux", target_arch = "aarch64"))']
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-aarch64-unknown-linux-musl.tar.gz"
bin-dir = "{ name }-v{ version }-aarch64-unknown-linux-musl/{ bin }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.'cfg(all(target_os = "windows", target_arch = "x86_64"))']
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-x86_64-pc-windows-gnu.zip"
bin-dir = "{ name }-v{ version }-x86_64-pc-windows-gnu/{ bin }{ binary-ext }"
pkg-fmt = "zip"

[lints]
workspace = true
