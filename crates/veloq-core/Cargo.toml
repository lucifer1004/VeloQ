[package]
name = "veloq-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared envelope, ProfileSource trait, and sort/time helpers for the veloq profile-query CLI."
# Publish whitelist — ship only what the crate needs to build: library
# sources, the recipe registry the build script codegens from, and the
# build script itself. Tests and local scratch stay out of the package.
include = ["src/**/*.rs", "src/recipes/registry.toml", "build.rs"]

[dependencies]
# `anyhow` is part of the public surface: `ProfileSource::dispatch`
# returns `anyhow::Result<_>` and `EnvelopeError::from_anyhow` accepts
# `&anyhow::Error`. The whole CLI family already returns anyhow from
# `main`, so propagating it through the trait keeps the agent-facing
# error envelope lossless without re-marshalling.
anyhow.workspace = true
# `clap` is on the public surface of `ProfileSource`: each source
# returns its own `clap::Command` for the CLI to graft into the
# top-level parser.
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
comfy-table.workspace = true
csv.workspace = true
terminal_size.workspace = true
# `bincode` powers the `SidecarCache<T>` helper that NSys data caches
# (correlation index, meta cache) use to persist version-headered
# payloads next to the trace. The veloq-nsys-data crate adds its own
# dep too for the payload type derives.
bincode.workspace = true
log.workspace = true

[lints]
workspace = true

# Build-time codegen for the recipe registry (`build.rs` reads
# `src/recipes/registry.toml`, validates it, and emits a static
# `&[Recipe]` slice that ships in the binary). Per
# [[feedback_build_rs_bundling]]: compile-time codegen rejects bad
# entries at `cargo build` instead of first-call runtime parse, and
# the parser crate stays out of the shipped binary by living here
# under `[build-dependencies]`.
[build-dependencies]
serde = { workspace = true, features = ["derive"] }
toml = "1.1.2"
