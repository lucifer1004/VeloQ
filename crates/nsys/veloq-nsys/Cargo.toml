[package]
name = "veloq-nsys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Nsight Systems profile source (CLI surface + dispatch) for VeloQ."
# Publish whitelist — library sources only; tests stay out of the package.
include = ["src/**/*.rs"]

[dependencies]
veloq-core.workspace = true
veloq-nsys-data.workspace = true
veloq-nsys-query.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
# CSV / table formatters live in this crate alongside the per-command
# `views` flatteners; the CLI binary delegates to them when the user
# asks for `--format csv` or `--format table`.
comfy-table.workspace = true
csv.workspace = true
terminal_size.workspace = true
log.workspace = true
thiserror.workspace = true

[dev-dependencies]
anyhow.workspace = true
tempfile.workspace = true

[lints]
workspace = true
