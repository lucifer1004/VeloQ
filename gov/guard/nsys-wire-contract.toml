#:schema ../schema/guard.schema.json

[govctl]
id = "GUARD-NSYS-WIRE-CONTRACT"
title = "NSys wire contract"
refs = [
    "RFC-0006",
    "RFC-0006:C-SOURCE-IDENTITY",
    "RFC-0006:C-SUPPORTED-INPUTS",
    "RFC-0006:C-COMMAND-SURFACE",
    "RFC-0006:C-ROW-ID",
    "RFC-0006:C-EVENT-REF",
    "RFC-0006:C-ROW-KEYS",
    "RFC-0006:C-NVTX-IDENTITY",
    "RFC-0006:C-SOURCE-EXCEPTIONS",
    "RFC-0006:C-COMPATIBILITY",
]

[check]
command = "bash -c 'cargo test --profile ci -p veloq-nsys stable_command_surface_matches_rfc_0006 && cargo test --profile ci -p veloq-nsys-query event_ref_contract && cargo test --profile ci -p veloq-nsys-query --test wire_format_smoke every_primary_rows_item_carries_key && cargo test --profile ci -p veloq-nsys-query --test metrics_smoke bucket_mode_emits_long_form_rows && cargo test --profile ci -p veloq-nsys-query --test metrics_nic_smoke bucket_mode_emits_long_form_rows && cargo test --profile ci -p veloq-nsys-query --test metrics_cpu_smoke stack_axis_groups_callchain_signatures && cargo test --profile ci -p veloq-nsys-query --test metrics_cpu_smoke bucket_mode_emits_long_form_rows && cargo test --profile ci -p veloq-nsys-query --test metrics_sched_smoke bucket_mode_emits_clipped_long_form && cargo test --profile ci -p veloq-nsys && cargo test --profile ci -p veloq --test cli_smoke schema_endpoint_emits_envelope_without_trace && cargo test --profile ci -p veloq --test cli_smoke summary_happy_path_emits_full_envelope && cargo test --profile ci -p veloq --test cli_smoke schema_bad_target_omits_trace_field && cargo test --profile ci -p veloq --test cli_smoke nsys_ncu_command_print_emits_only_shell_script && cargo test --profile ci -p veloq --test cli_smoke nsys_ncu_command_print_error_keeps_stdout_empty && cargo test --profile ci -p veloq-nsys-query'"
timeout_secs = 1200
