#:schema ../schema/guard.schema.json

[govctl]
id = "GUARD-NCU-WIRE-CONTRACT"
title = "NCU wire contract"
refs = [
    "RFC-0008",
    "RFC-0008:C-SOURCE-IDENTITY",
    "RFC-0008:C-SUPPORTED-INPUTS",
    "RFC-0008:C-COMMAND-SURFACE",
    "RFC-0008:C-ROW-ID",
    "RFC-0008:C-ROW-KEYS",
    "RFC-0008:C-METRIC-ENUMS",
    "RFC-0008:C-ARTIFACTS",
    "RFC-0008:C-SOURCE-EXCEPTIONS",
    "RFC-0008:C-COMPATIBILITY",
]

[check]
command = "bash -c 'cargo test --profile ci -p veloq-ncu --test source_schema_smoke && cargo test --profile ci -p veloq-ncu --test wire_format_smoke && cargo test --profile ci -p veloq-ncu --test launches_inspect_smoke && cargo test --profile ci -p veloq-ncu --test metrics_disasm_smoke && cargo test --profile ci -p veloq-ncu --test lists_smoke && cargo test --profile ci -p veloq-ncu --test source_metrics_smoke && cargo test --profile ci -p veloq-ncu --test verb_goldens && cargo test --profile ci -p veloq-ncu build_or_load_serves_committed_sidecar_when_report_absent && cargo test --profile ci -p veloq-ncu committed_sidecar_schema_mismatch_is_typed && cargo test --profile ci -p veloq-ncu committed_source_metric_sidecar_loads_without_ncu && cargo test --profile ci -p veloq --test cli_smoke ncu_summary_envelope_has_single_data_layer && cargo test --profile ci -p veloq --test cli_smoke ncu_summary_csv_emits_native_totals_projection && cargo test --profile ci -p veloq --test cli_smoke ncu_schema_endpoint_emits_envelope_without_trace && cargo test --profile ci -p veloq --test cli_smoke ncu_schema_bad_target_has_source_context_and_no_trace_span && cargo test --profile ci -p veloq --bin veloq automatic_detection_claims_representative_inputs_once'"
timeout_secs = 900
