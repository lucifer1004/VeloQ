#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-TRACK-TREE"
title = "Track tree resolution"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
The `nsys viz timeline` command MUST resolve requested track specifications into a deterministic track tree before rendering.

Each rendered track row MUST have a stable `track_key`.

Each rendered track row MUST have a human-readable label.

Each rendered track row MUST have an explicit role.

The stable role set MUST include `group`, `summary`, `detail`, `annotation`, and `overlay`.

A `group` role row MUST represent hierarchy or ownership context rather than source intervals.

A `summary` role row MUST represent rollup evidence for a parent resource, such as GPU busy activity for one process-local device.

A `detail` role row MUST represent concrete source intervals on a specific execution lane, such as a CUDA stream.

An `annotation` role row MUST represent explanatory or CPU-side context, such as CUDA API or NVTX ranges.

An `overlay` role item MUST represent derived explanatory evidence, such as idle gaps or selection windows, and MUST be visually distinguishable from ordinary source intervals.

Each rendered track row SHOULD carry axis metadata that identifies either the selected source evidence, the visual placement, or both when those axes apply.

Axis metadata and event placement semantics MUST follow [[RFC-0009:C-TRACK-PLACEMENT]].

GPU-related track rows MUST include native process identity in their stable track keys and source axes whenever device, context, stream, or correlation identity is process-local.

GPU-related track rows SHOULD be grouped under their owning process and device when the row's placement is device-scoped.

CUDA stream track rows SHOULD be grouped under their owning process-local CUDA device.

CUDA context groupings MAY be present.

CPU API track rows SHOULD be grouped by process and thread when the selected evidence is thread-local and no GPU placement is selected.

NVTX track rows SHOULD carry the rendered depth for each displayed range row when a depth selector applies.

NVTX track rows MAY be grouped under GPU device rows when the command derives process-aware device placement from source attribution evidence.

NVTX track rows MUST retain a fallback grouping for selected NVTX ranges whose device placement cannot be derived.

NVTX track row labels SHOULD include the nearest visible parent path when the requested depth is greater than one and the range has a visible parent.

Expansion track kinds MUST have deterministic ordering.

Top-N stream expansion SHOULD select streams by descending busy duration in the requested time window, then by process id, then by device id, then by stream id.

The rendered track tree SHOULD display selected CUDA stream rows under their owning process/device group; within one process/device group, stream rows SHOULD preserve the selected stream order.

The response MUST report the number of requested track specifications.

The response MUST report the number of resolved track rows.

The response MUST report when requested tracks were omitted because of render limits.

The SVG MUST render track labels as a left-side tree with indentation that reflects parent-child relationships.

The SVG SHOULD visually distinguish group, summary, detail, annotation, and overlay roles.

Summary rows SHOULD be visually weaker than detail rows when both show the same underlying execution interval.

Summary rows SHOULD avoid default visible item labels that make rollup evidence look like a second concrete execution lane.

**Rationale:** Agents need the exported figure to explain why rows appear and how they relate. Process-aware hierarchy prevents two ranks' logical device 0 and stream 0 from becoming one visual lane, while explicit row roles and placement provenance keep rollups, details, annotations, and overlays readable without interaction."""
