#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-TRACK-SPECS"
title = "Track specifications and axis selectors"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
An NSys visualization track specification MUST have the form `<track-kind>` or `<track-kind>:<selector>[,<selector>...]`.

A selector MUST have the form `<name>=<value>`.

The `process`, `device`, `stream`, and `context` selector values MUST be non-negative decimal integers unless a track kind explicitly permits `device=all`.

The `top` selector value MUST be a positive decimal integer.

The `depth` selector value MUST be a positive decimal integer.

The command MUST reject an invalid selector value with a structured diagnostic.

Track specifications MUST be parsed independently from one another.

Track-local selectors MUST take precedence over any command-level default selector with the same selector name.

The stable first-version track kind set MUST include `gpu`, `cuda-streams`, `cuda-stream`, `cuda-api`, `nvtx`, and `gaps-overlay`.

The `gpu` track kind MUST select aggregate GPU work for one or more process-local devices.

The `cuda-streams` track kind MUST expand to CUDA stream tracks selected from one or more process-local devices.

The `cuda-stream` track kind MUST select one exact CUDA stream.

The `cuda-api` track kind MUST select CPU-side CUDA Runtime and Driver API intervals.

The `nvtx` track kind MUST select NVTX ranges.

The `gaps-overlay` track kind MUST select GPU idle spans for overlay rendering rather than requiring a standalone lane.

CUDA device, context, and stream selector values MUST be interpreted inside a native-process namespace.

A selector that names a CUDA stream MUST identify a unique parent `(process, device)` scope unless the track kind defines an unambiguous expansion.

A selector that names a CUDA context MUST identify a unique parent `(process, device)` scope unless the track kind defines an unambiguous expansion.

The command MUST reject a `cuda-stream` specification that contains `stream=<id>` without a unique process/device selector.

When the same requested device ordinal exists in more than one process, an exact device-bearing selector MUST require `process=<pid>` or an explicit all-device expansion.

The command MUST reject unknown track kinds with a structured diagnostic.

The command MUST reject unknown selectors for a known track kind with a structured diagnostic.

The command MUST reject selector combinations that cannot resolve to a finite track set with a structured diagnostic.

The command SHOULD support `process=<pid>`, `device=<id>`, and `device=all` selectors for device-bearing track kinds.

The exact `cuda-stream` track kind MUST NOT accept `device=all`.

The command SHOULD support `top=<n>` for expansion track kinds whose natural expansion may be large.

The command SHOULD support `depth=<n>` for nested annotation track kinds such as `nvtx`.

**Rationale:** CUDA ordinals and handles are process-local. Track specifications therefore need native-process identity in addition to device, stream, and context ordinals to avoid merging rank-private namespaces while still allowing concise expansions such as top streams across all scopes."""
