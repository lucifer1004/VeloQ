#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-SUPPORTED-INPUTS"
title = "Supported inputs"
kind = "normative"
status = "active"

[content]
text = """
NSys automatic source detection MUST follow the side-effect-free trace detection contract in [[RFC-0004:C-TRACE-DETECTION]].

NSys automatic source detection MUST claim `.nsys-rep` inputs.

NSys automatic source detection MUST claim direct `_pqtdir` directory inputs.

NSys automatic source detection MAY claim a generated `parquetdir/` child only when that path can be resolved as an alias for the owning `.nsys-rep` artifact root specified by [[RFC-0005:C-ARTIFACT-ROOT]].

NSys automatic source detection MUST NOT claim `.sqlite` inputs.

An NSys trace-bearing command MUST emit a handled diagnostic error when the supplied input is not a supported NSys input and no explicit raw-output exception applies.

An NSys command that opens a supported input MUST keep generated artifacts under the artifact root defined by [[RFC-0005:C-ARTIFACT-ROOT]].

**Rationale:** Agents need source detection to be deterministic and side-effect-free. Alias handling keeps generated `parquetdir/` paths usable without splitting cache ownership across multiple artifact roots."""
