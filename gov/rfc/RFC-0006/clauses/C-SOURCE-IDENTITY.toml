#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-SOURCE-IDENTITY"
title = "Source identity"
kind = "normative"
status = "active"
since = "0.1.0"

[content]
text = """
NSys success responses MUST set `source.kind` to `nsys`.

NSys success responses MUST set `source.version` to `v3` for the wire contract specified by this RFC version.

NSys handled error responses MUST set `source.kind` to `nsys` when source context is known and no explicit raw-output exception applies.

NSys handled error responses MUST set `source.version` to `v3` when source context is known and no explicit raw-output exception applies.

The NSys source namespace MUST be `nsys`.

A breaking change to an NSys source payload MUST change the NSys source version according to [[RFC-0004:C-SOURCE-VERSION]].

An NSys source-owned command ID MUST use the `nsys.<verb>` form.

An NSys command invoked through a default-source hoisted alias MUST preserve the same `nsys.<verb>` command ID in the envelope.

An NSys trace-bearing success response MUST include `trace` when the input path is known.

An NSys trace-bearing handled error response MUST include `trace` when the input path is known and no explicit raw-output exception applies.

An NSys response with `trace_span` MUST set `trace_span.origin_ns` to an integer nanosecond origin.

An NSys response with `trace_span` MUST set `trace_span.span_ns` to an integer nanosecond duration.

The NSys `schema` command MUST NOT require a trace input.

The NSys `schema` command MUST omit `trace` and `trace_span` from its envelope.

Source version `v1` was the initial stable NSys wire contract.

Source version `v2` supersedes `v1` by changing NSys `prep` and `prep --status` to the canonical list response defined by [[RFC-0006:C-ARTIFACTS]].

Source version `v3` supersedes `v2` by removing the `nsys.viz.timeline` label character-cap option and the `data.auxiliary.label_policy.max_chars` response field.

**Rationale:** Source identity, source version, and command IDs are the dispatch context agents use after parsing an envelope. Hoisted aliases are a CLI convenience; they must not create a second wire identity for the same source command. Version `v2` marks the breaking cleanup that makes NSys `prep` and `prep --status` sidecar-readiness lists instead of singleton cache summaries. Version `v3` marks the breaking cleanup that makes timeline labels pixel-space driven instead of character-count capped."""
