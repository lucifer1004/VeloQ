#:schema ../schema/adr.schema.json

[govctl]
id = "ADR-0004"
title = "Use resident-first acceleration for the local daemon"
status = "accepted"
date = "2026-07-29"
refs = [
    "RFC-0011",
    "RFC-0006:C-INTERVAL-ACCELERATION",
    "ADR-0002",
]

[content]
context = """
VeloQ's daemon is deliberately limited to one machine and one operating-system user. The current implementation already reuses open source context, caches exact responses, evicts exact results before whole sessions, and selects idle sessions with the cost-aware recency policy chosen by [[ADR-0002]]. That policy is implemented and verified; this decision has no evidence that replacing it would improve correctness or operational behavior.

NSys already has a normalized `gpu-work-events.parquet` sidecar and source-table paths for interval evidence. No governed benchmark yet isolates a benefit from a second persistent interval format, because exact-response hits, source reuse, operating-system caching, and interval reuse have not been measured separately on varying-argument workloads. The proposed checkpointed `gpu-interval-index` would nevertheless add a manifest, format, atomic directory publication, prep readiness, freshness, cleanup, and migration surface.

[[RFC-0011]] fixes the local, optional, bounded, one-shot-compatible product boundary, and [[RFC-0006:C-INTERVAL-ACCELERATION]] owns evidence equivalence. The remaining decision is whether scan acceleration needs a second persistence layer before resident cache-miss evidence shows that construction must survive session eviction or daemon restart."""
decision = """
Choose resident-first interval acceleration for the manually enabled local daemon. Keep open source context and exact responses as the first reuse layers, and treat the existing NSys source tables and registered sidecars as the persistence boundary.

For scan-heavy queries with changing arguments, prefer a lazy session-local interval view derived from that existing evidence. Charge the view to the owning session and let the implemented result-first, cost-aware session eviction policy from [[ADR-0002]] manage pressure. This decision narrows the interval-storage choice; it does not replace the independent eviction decision.

Do not introduce a new persistent interval artifact now. Reconsider persistence only if cache-miss measurements show that resident rebuilding is a material repeated cost and a separately reported build-versus-reuse break-even justifies the extra lifecycle. This ordering wins because it removes an unimplemented coupled assumption while preserving verified daemon behavior."""
consequences = """
**Positive.** The interval design adds no new files, prep rows, source-fingerprint contract, atomic publication protocol, or cleanup cases. It fits the single-machine session lifetime, preserves the existing one-shot path, and does not create a cache-policy migration merely to simplify interval storage.

**Negative.** Useful interval state is rebuilt after session eviction or daemon restart, and memory-only acceleration does not improve standalone one-shot queries. The existing weighted eviction and resident-cost estimation remain non-trivial and imperfect; alternating heterogeneous profiles can still thrash or show tail-latency variance. A large derived view increases the importance of accurate session accounting.

**Neutral.** Exact results continue to be evicted before whole sessions, and whole-session selection remains governed by [[ADR-0002]]. Existing generated sidecars remain reusable across local processes and daemon lifetimes. If measurements later show rebuild-dominated scans, a persistent artifact will require a new governed decision."""

[[content.alternatives]]
text = "Resident-first interval reuse with the existing two-level eviction policy"
status = "accepted"
pros = [
    "Reuses the current NSys sidecar and daemon session lifetime without adding an artifact format",
    "Preserves the implemented result-first and cost-aware session eviction behavior instead of coupling interval simplification to a cache-policy rewrite",
]
cons = [
    "An evicted or restarted daemon may rebuild useful derived interval state",
    "The existing cost-aware eviction and memory-estimation complexity remains",
]

[[content.alternatives]]
text = "Persistent checkpointed interval artifact plus resident pages"
status = "rejected"
pros = [
    "Can amortize construction across daemon restarts and one-shot invocations",
    "Can support local checkpoint lookup without rebuilding derived sweeps",
]
cons = [
    "Duplicates existing persistent interval evidence and creates a second cache lifecycle",
    "Requires format, manifest, publication, readiness, cleanup, and migration authority before its break-even is known",
]
rejection_reason = "no governed cache-miss evidence shows that cross-session persistence repays its additional contract and implementation cost"

[[content.alternatives]]
text = "Keep only exact-response caching"
status = "rejected"
pros = ["Can return an identical stored response without repeating source or interval work"]
cons = ["Small window, filter, grouping, or bucket changes miss the cache and repeat scan work"]
rejection_reason = "exact caching remains useful but does not answer whether nearby scan-heavy requests can share interval work"

[[content.alternatives]]
text = "Resident-first interval reuse plus a rewrite to plain LRU"
status = "rejected"
pros = ["Would make whole-session victim selection depend only on recency"]
cons = [
    "Replaces implemented and verified heterogeneous-cost handling without evidence of a cache-quality problem",
    "Adds migration and regression risk while doing nothing to test the interval-acceleration hypothesis",
]
rejection_reason = "Occam favors removing the unimplemented persistence layer, not rewriting an independent working policy without failure evidence"
