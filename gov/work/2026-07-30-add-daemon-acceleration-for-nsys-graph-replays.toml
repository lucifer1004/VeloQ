[govctl]
id = "WI-2026-07-30-016"
title = "Add daemon acceleration for NSys graph replays"
status = "done"
created = "2026-07-30"
started = "2026-07-30"
completed = "2026-07-30"
refs = [
    "RFC-0011:C-SOURCE-CAPABILITY",
    "RFC-0011:C-ACCELERATION",
    "RFC-0011:C-EQUIVALENCE",
    "RFC-0011:C-SESSION-FRESHNESS",
    "RFC-0011:C-RESOURCE-CONFIG",
    "RFC-0006:C-CUDA-IDENTITY",
    "RFC-0006:C-ROW-KEYS",
    "ADR-0002",
]

[content]
description = "Add resident daemon execution and reusable graph-replay query state for NSys so repeated exploration with varying windows, sort orders, and node limits avoids rebuilding replay decomposition while preserving the existing one-shot semantics and artifact boundary."

[[content.acceptance_criteria]]
text = "Capability negotiation and daemon routing accept NSys graph-replays while retaining the specified auto and required fallback behavior for unsupported or incompatible daemons."
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "A session lazily reuses process-qualified replay summaries, launcher identity, busy decomposition, and ranked node aggregates across varying window, sort, limit, and top-nodes requests without creating a persistent artifact."
status = "done"
category = "added"

[[content.acceptance_criteria]]
text = "Daemon and one-shot graph-replays responses are byte-equivalent for both capture modes across process and device filters, NVTX scope, half-open windows, supported sort orders, limits, totals, node prefixes, and multi-process logical-device-zero identities."
status = "done"
category = "fixed"

[[content.acceptance_criteria]]
text = "Retained replay state is freshness-bound, disposable, cancellation-safe, and included in daemon resident-memory accounting with a correctness-preserving fallback when reuse cannot be proven."
status = "done"
category = "changed"

[[content.acceptance_criteria]]
text = "Prof-profile measurements on representative graph traces report cold, warm varying-argument, and exact-hit paths separately and demonstrate that varying-argument daemon queries no longer rebuild the full replay decomposition."
status = "done"
category = "chore"

[verification]
required_guards = [
    "GUARD-DAEMON-CONTRACT",
    "GUARD-NSYS-WIRE-CONTRACT",
]
