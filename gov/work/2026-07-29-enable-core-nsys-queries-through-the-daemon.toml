[govctl]
id = "WI-2026-07-29-004"
title = "Enable core NSys queries through the daemon"
status = "done"
created = "2026-07-29"
started = "2026-07-29"
completed = "2026-07-29"
refs = [
    "RFC-0011:C-EQUIVALENCE",
    "RFC-0011:C-SESSION-FRESHNESS",
    "RFC-0011:C-ACCELERATION",
    "RFC-0011:C-SOURCE-CAPABILITY",
